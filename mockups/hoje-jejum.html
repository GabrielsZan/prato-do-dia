<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prato do Dia — Hoje com jejum</title><style>
:root {
  --fundo: #F7F7F2;
  --cartao: #FFFFFF;
  --texto: #1E2420;
  --suave: #6B746E;
  --linha: #E8E9E2;
  --verde: #2F9E5B;
  --verde-claro: #E3F3E8;
  --laranja: #F08A24;

  --amarelo: #E2B228;
  --azul: #4F86E8;
  --azul-claro: #E3ECFB;
  --raio: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  width: 100%; max-width: 430px;
  min-height: 844px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.status { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; }
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: 0 1px 2px rgba(30,36,32,.05); }
.suave { color: var(--suave); }
button { font: inherit; border: none; background: none; color: inherit; cursor: pointer; }
.btn-mais {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--verde-claro); color: var(--verde);
  display: grid; place-items: center; flex-shrink: 0;
}
.btn-mais svg { width: 18px; height: 18px; }
</style><style>
.titulo{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:4px 16px 12px}
.c{margin:0 16px 12px;padding:16px}
.c h2{font-size:16px;font-weight:700}
.suave{color:var(--suave);font-size:13px}
.sub{display:flex;align-items:center;gap:6px;padding:4px 8px 12px}
.sub h1{font-size:22px;font-weight:800}
.abas{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:84px;background:rgba(255,255,255,.94);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding-top:8px}
.aba{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--suave);width:70px}
.aba.ativa{color:var(--verde);font-weight:600}
.aba svg{width:24px;height:24px}
.fab{width:54px;height:54px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(47,158,91,.35)}
.btn{width:100%;height:54px;border-radius:16px;background:var(--verde);color:#fff;font-size:17px;font-weight:700}
.btn2{width:100%;height:50px;border-radius:14px;background:var(--verde-claro);color:var(--verde);font-size:16px;font-weight:700}

.resumo-f{margin:0 16px;padding:18px;height:164px;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:13px}
.faixa{margin:10px 16px 0;padding:10px 14px;display:flex;align-items:center;gap:12px}
.ico{width:36px;height:36px;border-radius:11px;background:var(--laranja-claro);color:var(--laranja);display:grid;place-items:center;flex-shrink:0}
.barra{height:6px;border-radius:3px;background:var(--linha);overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;width:83%;background:var(--laranja);border-radius:3px}
</style></head><body><div class="status"><span>9:41</span><span>●●● 100%</span></div>
