<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prato do Dia — Peso</title><style>
:root {
  --fundo: #F7F7F2;
  --cartao: #FFFFFF;
  --texto: #1E2420;
  --suave: #6B746E;
  --linha: #E8E9E2;
  --verde: #2F9E5B;
  --verde-claro: #E3F3E8;
  --laranja: #F08A24;
  --laranja-claro: #FDEBD8;
  --amarelo: #E2B228;
  --azul: #4F86E8;
  --azul-claro: #E3ECFB;
  --raio: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  width: 100%; max-width: 430px;
  min-height: 844px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.status { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; }
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: 0 1px 2px rgba(30,36,32,.05); }
.suave { color: var(--suave); }
button { font: inherit; border: none; background: none; color: inherit; cursor: pointer; }
.btn-mais {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--verde-claro); color: var(--verde);
  display: grid; place-items: center; flex-shrink: 0;
}
.btn-mais svg { width: 18px; height: 18px; }
</style><style>
.titulo{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:4px 16px 12px}
.c{margin:0 16px 12px;padding:16px}
.c h2{font-size:16px;font-weight:700}
.linha-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.btn-p{font-size:14px;font-weight:700;color:var(--verde);background:var(--verde-claro);padding:7px 12px;border-radius:16px;display:flex;align-items:center;gap:4px}
.grande{font-size:30px;font-weight:800;letter-spacing:-1px}
.suave{color:var(--suave);font-size:13px}
.abas{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:84px;background:rgba(255,255,255,.94);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding-top:8px}
.aba{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--suave);width:70px}
.aba.ativa{color:var(--verde);font-weight:600}
.aba svg{width:24px;height:24px}
.fab{width:54px;height:54px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(47,158,91,.35)}
.fundo{position:fixed;inset:0;background:rgba(20,24,22,.38)}
.folha{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px 34px}
.pega{width:38px;height:5px;border-radius:3px;background:var(--linha);margin:0 auto 14px}
.folha h2{font-size:20px;font-weight:800}

.valor{margin:18px 0 8px;height:72px;border:2px solid var(--verde);border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.valor b{font-size:40px;font-weight:800}
.data{display:flex;justify-content:space-between;padding:12px 0;font-size:15px;border-bottom:1px solid var(--linha)}
.btn{width:100%;height:54px;border-radius:16px;background:var(--verde);color:#fff;font-size:17px;font-weight:700;margin:14px 0}
.hist div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--linha);font-size:14px}
</style></head><body><div class="status"><span>9:41</span><span>●●● 100%</span></div><h1 class="titulo">Progresso</h1><div class="cartao c" style="height:260px"></div>
<div class="fundo"></div>
<div class="folha"><div class="pega"></div>
 <h2>Registrar peso</h2>
 <div class="valor"><b>84,2</b><span class="suave" style="font-size:18px">kg</span></div>
 <div class="data"><span>Data</span><b>Hoje, qua 4 nov ›</b></div>
 <div class="data"><span>Meta de peso</span><b>80 kg ›</b></div>
 <button class="btn">Salvar</button>
 <div class="suave" style="margin-bottom:4px">Últimas pesagens</div>
 <div class="hist"><div><span>Seg, 27 out</span><b>84,7 kg</b></div><div><span>Seg, 20 out</span><b>85,3 kg</b></div><div><span>Seg, 13 out</span><b>85,1 kg</b></div></div>
 <div class="suave" style="margin-top:10px">Toque numa pesagem para corrigir ou apagar.</div>
</div></body></html>
