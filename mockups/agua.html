<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prato do Dia — Água</title><style>
:root {
  --fundo: #F7F7F2;
  --cartao: #FFFFFF;
  --texto: #1E2420;
  --suave: #6B746E;
  --linha: #E8E9E2;
  --verde: #2F9E5B;
  --verde-claro: #E3F3E8;
  --laranja: #F08A24;
  --laranja-claro: #FDEBD8;
  --amarelo: #E2B228;
  --azul: #4F86E8;
  --azul-claro: #E3ECFB;
  --raio: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  background: var(--fundo);
  color: var(--texto);
  width: 100%; max-width: 430px;
  min-height: 844px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.status { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; }
.cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: 0 1px 2px rgba(30,36,32,.05); }
.suave { color: var(--suave); }
button { font: inherit; border: none; background: none; color: inherit; cursor: pointer; }
.btn-mais {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--verde-claro); color: var(--verde);
  display: grid; place-items: center; flex-shrink: 0;
}
.btn-mais svg { width: 18px; height: 18px; }
</style><style>
.titulo{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:4px 16px 12px}
.c{margin:0 16px 12px;padding:16px}
.c h2{font-size:16px;font-weight:700}
.linha-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.btn-p{font-size:14px;font-weight:700;color:var(--verde);background:var(--verde-claro);padding:7px 12px;border-radius:16px;display:flex;align-items:center;gap:4px}
.grande{font-size:30px;font-weight:800;letter-spacing:-1px}
.suave{color:var(--suave);font-size:13px}
.abas{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:84px;background:rgba(255,255,255,.94);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding-top:8px}
.aba{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--suave);width:70px}
.aba.ativa{color:var(--verde);font-weight:600}
.aba svg{width:24px;height:24px}
.fab{width:54px;height:54px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(47,158,91,.35)}
.fundo{position:fixed;inset:0;background:rgba(20,24,22,.38)}
.folha{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px 34px}
.pega{width:38px;height:5px;border-radius:3px;background:var(--linha);margin:0 auto 14px}
.folha h2{font-size:20px;font-weight:800}

.agua{margin:10px 16px 0;padding:14px 16px;display:flex;align-items:center;gap:12px}
.copos{display:flex;gap:5px;margin-top:6px}
.copos i{width:18px;height:24px;border-radius:3px 3px 6px 6px;background:var(--azul-claro)}
.copos i.on{background:var(--azul)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--azul-claro);color:var(--azul);display:grid;place-items:center;flex-shrink:0}
.mais-azul{width:44px;height:44px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;flex-shrink:0}
.resumo-f{margin:0 16px;padding:18px;height:164px;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:13px}
.big{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.big button{width:56px;height:56px;border-radius:16px;background:var(--fundo);font-size:28px}
.big b{font-size:44px;font-weight:800;letter-spacing:-1px}
.tam{display:flex;gap:8px;margin:16px 0 6px}
.tam span{padding:8px 13px;border-radius:20px;background:var(--fundo);font-size:14px;font-weight:600}
.tam .on{background:var(--azul);color:#fff}
.campo{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--linha);font-size:15px}
</style></head><body><div class="status"><span>9:41</span><span>●●● 100%</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px"><h1 style="font-size:28px;font-weight:800">Hoje</h1><span style="background:#fff;padding:7px 12px;border-radius:20px;font-weight:600;font-size:15px">Qua, 4 nov</span></div>
<div class="cartao resumo-f">(anel de calorias e macros, como já está)</div>
<div class="cartao agua">
 <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5C8 8 6 11.2 6 14.5a6 6 0 0012 0C18 11.2 16 8 12 2.5z"/></svg></div>
 <div style="flex:1"><div style="font-size:15px;font-weight:700">Água <span class="suave" style="font-weight:400">· 1,25 de 2 L</span></div>
 <div class="copos"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div></div>
 <button class="mais-azul" aria-label="Mais um copo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="cartao" style="margin:10px 16px;padding:14px;height:120px;color:var(--suave);font-size:13px">(refeições do dia…)</div>
<div class="fundo"></div>
<div class="folha"><div class="pega"></div>
 <h2>Água de hoje</h2>
 <div class="big"><button>−</button><b>5</b><span class="suave" style="font-size:16px">copos</span><button>+</button></div>
 <div style="text-align:center" class="suave">= 1,25 L de 2 L</div>
 <div class="tam"><span>200 ml</span><span class="on">250 ml</span><span>300 ml</span><span>500 ml</span></div>
 <div class="suave" style="margin-bottom:6px">Tamanho do copo</div>
 <div class="campo"><span>Meta por dia</span><b>8 copos (2 L) ›</b></div>
</div>
</body></html>
